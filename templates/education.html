<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>🚨 警告：你被騙了！</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="education-body">
    <div class="warning-container">
        <div class="warning-icon">⚠️</div>
        <h1 class="alert-title">你被騙了！</h1>
        <p style="font-size: 1.2rem; margin-bottom: 20px;">剛剛那是一個模擬的釣魚登入頁面。<br>如果您在真實世界中輸入了帳號密碼，您的個人資料已經落入詐騙集團手中！</p>
        
        <div class="scam-info">
            <h3>本次遭遇的詐騙手法：{{ scam_type }}</h3>
            {% if image_b64 %}
            <div style="margin: 20px 0; text-align: center;">
                <p style="font-weight: bold; color: #ff5252; margin-bottom: 8px;">🚨 模擬的詐騙配圖 / 廣告圖片：</p>
                <img src="data:image/png;base64,{{ image_b64 }}" alt="詐騙配圖" style="max-width: 100%; max-height: 250px; border-radius: 8px; border: 3px solid #ff5252; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);">
            </div>
            {% endif %}
            <p><strong>詐騙文案 / 情境：</strong><br>「{{ context }}」</p>
        </div>
        
        <a href="/scammed_again" class="btn-restart">更多資訊</a>
    </div>
</body>
</html>
